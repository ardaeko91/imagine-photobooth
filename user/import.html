<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Foto - Imagine Photobooth AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { background-color: #020617; font-family: system-ui, -apple-system, sans-serif; }
    @keyframes auroraRotate { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(360deg) scale(1); } }
    .aurora {
      position: absolute; width: 180%; height: 180%; top: -40%; left: -40%;
      background: conic-gradient(from 0deg at 50% 50%, #4f46e5 0deg, #7c3aed 90deg, #db2777 180deg, #0284c7 270deg, #4f46e5 360deg);
      filter: blur(90px); animation: auroraRotate 25s linear infinite; border-radius: 50%; pointer-events: none; opacity: 0.5;
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-between p-4 md:p-8 relative overflow-x-hidden select-none">
  <div class="aurora"></div>

  <header class="w-full max-w-4xl mx-auto flex justify-between items-center z-10">
    <a href="index.html" class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-semibold border border-white/15 transition">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali
    </a>
    <span class="font-bold text-sm text-white">Langkah 1: Pilih / Upload Foto</span>
  </header>

  <main class="w-full max-w-md mx-auto z-10 my-auto space-y-5 text-center">
    <div onclick="document.getElementById('fileInput').click()" class="w-full max-w-[260px] md:max-w-[300px] h-[52vh] max-h-[440px] min-h-[280px] mx-auto rounded-3xl border-2 border-dashed border-white/20 hover:border-indigo-400 bg-slate-900/80 backdrop-blur-xl transition cursor-pointer flex flex-col items-center justify-center p-6 relative overflow-hidden group shadow-2xl">
      <img id="previewImage" class="hidden absolute inset-0 w-full h-full object-cover rounded-3xl" />
      <div id="uploadPlaceholder" class="flex flex-col items-center space-y-3">
        <div class="w-16 h-16 rounded-2xl bg-indigo-600/30 flex items-center justify-center text-indigo-400 group-hover:scale-110 transition">
          <i data-lucide="upload-cloud" class="w-8 h-8"></i>
        </div>
        <div>
          <p class="font-bold text-sm text-white">Klik atau Tarik Foto Ke Sini</p>
          <p class="text-xs text-slate-400 mt-1">Format JPG, PNG (Maks 10MB)</p>
        </div>
      </div>
      <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)" />
    </div>

    <div class="w-full max-w-[300px] mx-auto">
      <button id="nextBtn" onclick="goToStyle()" disabled class="w-full py-3.5 px-6 rounded-2xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 disabled:cursor-not-allowed font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30 transition">
        <span>Lanjut Pilih Gaya AI</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </div>
  </main>

  <footer class="w-full max-w-4xl mx-auto text-center z-10 border-t border-white/10 pt-4">
    <p class="text-xs text-slate-400">LuxaryMedia_AiProject @ardaeko</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", function() { lucide.createIcons(); });

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      // Validasi tipe & ukuran (maks 10MB, JPG/PNG)
      if (!/^image\/(jpeg|png|webp)$/.test(file.type)) {
        alert("Format tidak didukung. Gunakan JPG, PNG, atau WebP.");
        return;
      }
      if (file.size > 10 * 1024 * 1024) {
        alert("Ukuran foto melebihi 10MB.");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const dataUrl = e.target.result;
        document.getElementById('previewImage').src = dataUrl;
        document.getElementById('previewImage').classList.remove('hidden');
        document.getElementById('uploadPlaceholder').classList.add('hidden');
        document.getElementById('nextBtn').disabled = false;
        // Simpan foto untuk dibawa ke halaman berikutnya
        try { localStorage.setItem('pb_photo', dataUrl); } catch (err) {}
      }
      reader.readAsDataURL(file);
    }

    function goToStyle() {
      if (!localStorage.getItem('pb_photo')) { alert("Pilih foto dulu sebelum lanjut."); return; }
      window.location.href = "style.html";
    }
  </script>
</body>
</html>
