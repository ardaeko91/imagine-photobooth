<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSLR Camera Mode - Imagine Photobooth AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { background-color: #020617; font-family: system-ui, -apple-system, sans-serif; }
    @keyframes auroraRotate { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(360deg) scale(1); } }
    .aurora {
      position: absolute; width: 180%; height: 180%; top: -40%; left: -40%;
      background: conic-gradient(from 0deg at 50% 50%, #4f46e5 0deg, #7c3aed 90deg, #db2777 180deg, #0284c7 270deg, #4f46e5 360deg);
      filter: blur(90px); animation: auroraRotate 25s linear infinite; border-radius: 50%; pointer-events: none; opacity: 0.5;
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-between p-4 md:p-8 relative overflow-x-hidden select-none">
  <div class="aurora"></div>

  <header class="w-full max-w-4xl mx-auto flex justify-between items-center z-10">
    <a href="index.html" class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-semibold border border-white/15 transition">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali
    </a>
    <span class="font-bold text-sm text-white">DSLR Tethering Mode</span>
  </header>

  <main class="w-full max-w-sm mx-auto z-10 my-auto text-center space-y-5">
    <div id="previewBox" class="relative w-full max-w-[260px] md:max-w-[300px] h-[52vh] max-h-[440px] min-h-[280px] mx-auto rounded-3xl bg-slate-900 border-2 border-pink-500/40 overflow-hidden shadow-2xl flex items-center justify-center">
      <img id="dslrImg" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&auto=format&fit=crop" class="w-full h-full object-cover" />
      <div class="absolute top-4 right-4 flex items-center gap-2 bg-black/60 px-3 py-1 rounded-full border border-white/10 text-[10px] font-mono text-pink-400">
        <span>DSLR CONNECTED</span>
      </div>
    </div>

    <div class="space-y-3 w-full max-w-[300px] mx-auto">
      <button id="captureBtn" onclick="captureDslr()" class="w-full py-3.5 px-6 rounded-2xl bg-pink-600 hover:bg-pink-500 font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-pink-600/30 transition">
        <i data-lucide="aperture" class="w-4 h-4"></i>
        <span id="captureLabel">Jepret Kamera DSLR</span>
      </button>

      <button id="nextBtn" onclick="goToStyle()" disabled class="w-full py-3.5 px-6 rounded-2xl bg-emerald-500 hover:bg-emerald-400 disabled:opacity-40 font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/30 transition">
        <span>Lanjut Pilih Gaya AI</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </div>
  </main>

  <footer class="w-full max-w-4xl mx-auto text-center z-10 border-t border-white/10 pt-4">
    <p class="text-xs text-slate-400">LuxaryMedia_AiProject @ardaeko</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", function() { lucide.createIcons(); });

    // Mode DSLR tether membutuhkan backend (gphoto2 / capture card).
    // Untuk sekarang, alur disimulasikan memakai foto contoh agar aliran halaman nyambung.
    function captureDslr() {
      const src = document.getElementById('dslrImg').src;
      localStorage.setItem('pb_photo', src);
      document.getElementById('captureLabel').textContent = 'Foto Tersimpan ✓';
      document.getElementById('captureBtn').disabled = true;
      document.getElementById('nextBtn').disabled = false;
    }

    function goToStyle() {
      if (!localStorage.getItem('pb_photo')) { alert('Jepret foto dulu sebelum lanjut.'); return; }
      window.location.href = 'style.html';
    }
  </script>
</body>
</html>
