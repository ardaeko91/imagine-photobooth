<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memproses Foto - Imagine Photobooth AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/api.js"></script>
  <style>
    body { background-color: #020617; font-family: system-ui, -apple-system, sans-serif; }
    @keyframes auroraRotate { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(360deg) scale(1); } }
    .aurora {
      position: absolute; width: 180%; height: 180%; top: -40%; left: -40%;
      background: conic-gradient(from 0deg at 50% 50%, #4f46e5 0deg, #7c3aed 90deg, #db2777 180deg, #0284c7 270deg, #4f46e5 360deg);
      filter: blur(90px); animation: auroraRotate 25s linear infinite; border-radius: 50%; pointer-events: none; opacity: 0.5;
    }
  </style>
</head>
<body class="h-screen text-slate-100 flex flex-col justify-between p-8 relative overflow-hidden select-none">
  <div class="aurora"></div>

  <header class="w-full max-w-4xl mx-auto flex justify-between items-center z-10">
    <span class="font-bold text-sm text-white">Memproses AI Style...</span>
  </header>

  <main class="w-full max-w-md mx-auto text-center space-y-6 z-10 my-auto">
    <div class="relative w-24 h-24 mx-auto flex items-center justify-center">
      <div class="absolute inset-0 rounded-full border-4 border-indigo-500/20 border-t-indigo-500 animate-spin"></div>
      <i data-lucide="wand-2" class="w-10 h-10 text-indigo-400 animate-pulse"></i>
    </div>

    <div class="space-y-2">
      <h2 class="text-xl font-bold text-white">Sedang Menggenerasi Foto...</h2>
      <p class="text-xs text-slate-300">Mohon tunggu sebentar, AI sedang meracik fotomu.</p>
      <p id="themeLabel" class="text-xs font-mono text-indigo-300 px-3 py-1.5 rounded-full bg-indigo-500/20 border border-indigo-500/30 inline-block"></p>
    </div>

    <!-- Preview foto asal yang sedang diproses -->
    <div class="w-28 h-44 mx-auto rounded-2xl overflow-hidden border-2 border-indigo-500/40 shadow-2xl bg-slate-900">
      <img id="previewImg" alt="Foto asal" class="w-full h-full object-cover" />
    </div>

    <div class="w-full h-2 rounded-full bg-slate-900 border border-white/10 overflow-hidden">
      <div id="progressBar" class="h-full bg-gradient-to-r from-indigo-500 via-pink-500 to-emerald-400 w-0 transition-all duration-500"></div>
    </div>
    <p id="progressText" class="text-[11px] font-mono text-slate-400">0%</p>
    <p id="aiStatus" class="hidden text-[11px] font-mono text-amber-300 px-3 py-1.5 rounded-xl bg-amber-500/10 border border-amber-500/30"></p>
  </main>

  <footer class="w-full max-w-4xl mx-auto text-center z-10 border-t border-white/10 pt-4">
    <p class="text-xs text-slate-400">LuxaryMedia_AiProject @ardaeko</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", async function() {
      if (window.lucide) lucide.createIcons();

      // Baca data dari localStorage
      const photo = localStorage.getItem('pb_photo');
      const theme = localStorage.getItem('pb_theme');

      // Guard: tidak ada data -> kembali ke index
      if (!photo) { window.location.href = "index.html"; return; }

      document.getElementById('previewImg').src = photo;
      document.getElementById('themeLabel').textContent = theme ? 'Gaya: ' + theme : 'Gaya: Default';

      const bar = document.getElementById('progressBar');
      const txt = document.getElementById('progressText');
      const statusEl = document.getElementById('aiStatus');
      let progress = 0;

      // Progress berjalan pelan menuju 90% selama AI bekerja
      const timer = setInterval(() => {
        progress = Math.min(90, progress + Math.floor(Math.random() * 6) + 2);
        bar.style.width = progress + '%';
        txt.textContent = progress + '%';
      }, 500);

      function finish(photoData) {
        clearInterval(timer);
        localStorage.setItem('pb_photo', photoData);
        bar.style.width = '100%';
        txt.textContent = '100%';
        setTimeout(() => { window.location.href = "result.html"; }, 600);
      }

      function fallbackDemo(reason) {
        console.warn('Fallback mode demo:', reason);
        statusEl.textContent = 'MODE DEMO — foto asli dipakai (' + reason + ')';
        statusEl.classList.remove('hidden');
        finish(photo);
      }

      // Coba generate AI memakai engine aktif dari Admin (Gemini / fal.ai)
      if (typeof GeminiAPI !== 'undefined' && GeminiAPI.isConfigured()) {
        try {
          // Cari prompt & kualitas dari preset yang cocok dengan tema yang dipilih
          var prompt = '';
          var quality = getOutputQuality();
          var presetImage = '';
          var themeName = (theme || '').toLowerCase();
          try {
            var presets = getPresets();
            for (var i = 0; i < presets.length; i++) {
              if (presets[i].active !== false && (presets[i].name || '').toLowerCase() === themeName) {
                prompt = presets[i].prompt || '';
                if (presets[i].quality) quality = presets[i].quality;
                presetImage = presets[i].image || '';
                break;
              }
            }
          } catch (e) { /* pakai prompt generik */ }

          if (!prompt) {
            prompt = 'Transform this photo into a "' + (theme || 'cinematic') + '" style portrait. Keep the person\'s facial identity, high detail, professional photobooth quality.';
          }

          statusEl.textContent = 'AI (' + getAiEngine().toUpperCase() + ' / ' + getActiveModel() + ') sedang memproses...';
          statusEl.classList.remove('hidden');

          var engine = getAiEngine();
          // Urutan kanonik: foto tamu (webcam) = gambar #1, outfit preset = gambar #2
          var guestImages = [{ role: 'guest', source: photo }];
          if (presetImage) guestImages.push({ role: 'outfit', source: presetImage });
          var result = await GeminiAPI.generateStyledPhoto({
            images: guestImages,
            prompt: prompt,
            quality: quality
          });

          if (result.imageDataUrl) {
            statusEl.textContent = '✓ Selesai dihasilkan oleh ' + (engine === 'fal' ? 'Fal.ai' : 'Gemini');
            finish(result.imageDataUrl);
          } else {
            fallbackDemo('engine tidak mengembalikan gambar');
          }
        } catch (err) {
          console.error(err);
          fallbackDemo(err.message || 'gagal memanggil AI');
        }
      } else {
        fallbackDemo('API key belum diisi di Admin');
      }
    });
  </script>
</body>
</html>
