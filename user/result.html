<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hasil Foto - Imagine Photobooth AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/store.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { background-color: #020617; font-family: system-ui, -apple-system, sans-serif; }
    @keyframes auroraRotate { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(360deg) scale(1); } }
    .aurora {
      position: absolute; width: 180%; height: 180%; top: -40%; left: -40%;
      background: conic-gradient(from 0deg at 50% 50%, #4f46e5 0deg, #7c3aed 90deg, #db2777 180deg, #0284c7 270deg, #4f46e5 360deg);
      filter: blur(90px); animation: auroraRotate 25s linear infinite; border-radius: 50%; pointer-events: none; opacity: 0.5;
    }
  </style>
</head>
<body class="h-screen text-slate-100 flex flex-col justify-between p-8 relative overflow-hidden select-none">
  <div class="aurora"></div>

  <header class="w-full max-w-4xl mx-auto flex justify-between items-center z-10">
    <span class="font-bold text-sm text-white">Hasil Foto AI Kamu 🎉</span>
    <a href="index.html" class="px-3.5 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-semibold border border-white/15 transition flex items-center gap-1.5">
      <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Sesi Baru
    </a>
  </header>

  <main class="w-full max-w-2xl mx-auto z-10 my-auto grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
    <div class="relative w-full max-w-[300px] mx-auto h-[52vh] max-h-[440px] min-h-[280px] rounded-3xl bg-slate-900 border-2 border-indigo-500/50 overflow-hidden shadow-2xl">
      <img id="resultImg" alt="Hasil foto" class="w-full h-full object-cover" />
      <img id="frameImg" class="absolute inset-0 w-full h-full object-cover hidden pointer-events-none" />
      <div id="themeBadge" class="absolute top-3 left-3 px-3 py-1.5 rounded-full bg-indigo-600/70 border border-indigo-400/50 text-[10px] font-mono text-white backdrop-blur-md"></div>
      <div class="absolute bottom-3 left-3 right-3 p-2 rounded-xl bg-black/60 backdrop-blur-md border border-white/10 text-center">
        <p id="wmIg" class="text-[10px] font-mono text-indigo-300 font-bold">DEVELOPED BY @ardaeko</p>
        <p id="wmBrand" class="text-[9px] text-slate-300">LuxaryMedia_AiProject</p>
      </div>
    </div>

    <div class="space-y-6 text-center">
      <div class="space-y-2">
        <h2 id="congratsTitle" class="text-2xl font-bold text-white">Scan QR Untuk Unduh</h2>
        <p class="text-xs text-slate-300">Arahkan kamera HP kamu ke QR Code di bawah untuk menyimpan foto HD.</p>
      </div>

      <div class="w-40 h-40 mx-auto p-3 rounded-2xl bg-white flex items-center justify-center shadow-xl">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://instagram.com/ardaeko" class="w-full h-full object-contain" />
      </div>

      <div class="pt-2">
        <a href="index.html" onclick="startNewSession()" class="w-40 mx-auto py-3.5 px-4 rounded-2xl bg-indigo-600 hover:bg-indigo-500 font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30 transition">
          <i data-lucide="sparkles" class="w-4 h-4 shrink-0"></i>
          <span>Selesai &amp; Foto Lagi</span>
        </a>
      </div>
    </div>
  </main>

  <footer class="w-full max-w-4xl mx-auto text-center z-10 border-t border-white/10 pt-4">
    <p id="footerBrand" class="text-xs text-slate-400">LuxaryMedia_AiProject @ardaeko</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      lucide.createIcons();

      const photo = localStorage.getItem('pb_photo');
      const theme = localStorage.getItem('pb_theme');

      // Guard: tanpa data, kembali ke index
      if (!photo) { window.location.href = "index.html"; return; }

      document.getElementById('resultImg').src = photo;
      document.getElementById('themeBadge').textContent = theme ? 'Gaya: ' + theme : 'Gaya: Default';
      document.getElementById('congratsTitle').textContent = theme ? ('Hasil "' + theme + '" Kamu 👏') : 'Hasil Foto AI Kamu 🎉';

      // Terapkan branding dari admin (nama brand + IG + frame PNG)
      applyBranding();

      // Catat hasil ke gallery admin (pb_gallery)
      addToGallery({
        id: uid('g'),
        session: 'Session-' + nextSessionSeq(),
        theme: theme || 'Default',
        photo: photo,
        source: 'kiosk'
      });
    });

    function applyBranding() {
      var b = getBranding();
      var ig = b.igHandle || '@ardaeko';
      var brand = b.brandName || 'LuxaryMedia_AiProject';

      document.getElementById('wmIg').textContent = 'DEVELOPED BY ' + ig;
      document.getElementById('wmBrand').textContent = brand;
      if (brand) document.getElementById('footerBrand').textContent = brand + ' ' + ig;

      if (b.frameDataUrl) {
        var frame = document.getElementById('frameImg');
        frame.src = b.frameDataUrl;
        frame.classList.remove('hidden');
      }
    }

    // Bersihkan data sesi lalu ke index (event default link tetap jalan)
    function startNewSession() {
      localStorage.removeItem('pb_photo');
      localStorage.removeItem('pb_theme');
    }
  </script>
</body>
</html>
